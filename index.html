<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Courier+Prime&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { -webkit-font-smoothing: antialiased; }

  canvas { position: fixed; left: 0; top: 0; }
  #tree { z-index: 1; }
  #scan {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(90deg, var(--scan) 0 1px, transparent 1px 3px);
  }
  #hand { position: fixed; z-index: 3; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  #glow { position: fixed; z-index: 4; pointer-events: none; border-radius: 999px; mix-blend-mode: screen; }
  #bar {
    position: fixed; z-index: 5; box-sizing: border-box; margin: 0;
    background: transparent; border: 0; outline: 0; border-radius: 999px;
    font-family: 'Courier Prime', 'Courier New', monospace; text-align: center;
    color: var(--ink); caret-color: var(--ink);
  }
  #bar::placeholder { color: var(--ink-soft); }
  #bar[readonly] { caret-color: transparent; }
  #fx { z-index: 6; pointer-events: none; }
  #hint {
    position: fixed; z-index: 6; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 32px); pointer-events: none;
    font: 13px/1.6 'Courier Prime', 'Courier New', monospace; text-align: center; white-space: pre-line;
    color: var(--hint); text-shadow: 0 0 10px var(--bg), 0 0 4px var(--bg), 0 0 2px var(--bg);
    opacity: 0; transition: opacity 1.2s ease;
  }
  #tip {
    position: fixed; z-index: 8; max-width: min(300px, 80vw); pointer-events: none;
    font: 12px/1.55 'Courier Prime', 'Courier New', monospace; color: var(--tip);
    text-shadow: 0 0 8px var(--bg), 0 0 2px var(--bg); opacity: 0; transition: opacity .35s ease;
  }
  #tip .from { display: block; margin-top: .35em; opacity: .6; }

  /* left panel: the meaning of the word */
  #panel, #count {
    position: fixed; z-index: 5; left: 64px; margin: 0;
    font-family: 'Courier Prime', 'Courier New', monospace;
    user-select: text; -webkit-user-select: text; cursor: default;
  }
  #panel { top: 50%; transform: translateY(-50%); max-width: 340px; color: var(--panel-body); }
  #panel h1 { margin: 0 0 .3em; font: 400 88px/.9 'Courier Prime', 'Courier New', monospace; color: var(--panel-title); white-space: nowrap; }
  #panel .say { margin: 0 0 1.4em; font-size: 14px; color: var(--panel-muted); }
  #panel ol { margin: 0; padding: 0; list-style: none; font-size: 16px; line-height: 1.7; }
  #panel ol b { font-weight: 400; color: var(--panel-num); }
  #panel hr { width: 40px; height: 0; margin: 1.6em 0; border: 0; border-top: 1px solid var(--panel-line); }
  #panel .how { margin: 0; font-size: 13px; line-height: 1.7; color: var(--panel-muted); }
  #panel .how + .how { margin-top: 1em; }
  #count { bottom: 24px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--panel-count); }

  #intro {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; align-items: center; justify-content: center; transition: opacity 2.4s ease;
  }
  #introText {
    display: flex; flex-direction: column; align-items: center; padding: 0 16px;
    transition: opacity 1.2s ease;
  }
  #introText.gone { opacity: 0; pointer-events: none; }
  #intro button {
    font: 400 clamp(40px, 7vw, 80px)/1 'Special Elite', 'Courier New', monospace; letter-spacing: .04em;
    color: var(--intro); background: none; border: 0; padding: .2em .4em; cursor: pointer;
    animation: inhale 6s ease-in-out infinite;
  }
  #intro button:focus-visible { outline: 1px solid var(--hint); outline-offset: 6px; }
  #calib {
    position: absolute; font: 400 18px 'Special Elite', 'Courier New', monospace; color: var(--intro);
    opacity: 0; transition: opacity 1.2s ease; pointer-events: none;
  }
  @keyframes inhale { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }

  #debug {
    position: fixed; left: 8px; top: 8px; z-index: 11; display: none;
    font: 11px/1.4 monospace; color: #9f9; background: rgba(0, 0, 0, .6); padding: 6px 8px; white-space: pre;
  }
</style>
</head>
<body>
  <canvas id="tree"></canvas>
  <div id="scan"></div>
  <img id="hand" alt="" draggable="false">
  <div id="glow"></div>
  <input id="bar" type="text" autocomplete="off" spellcheck="false" aria-label="memoria / memory">
  <canvas id="fx"></canvas>
  <div id="panel">
    <h1>aliento</h1>
    <p class="say">a·lien·to · m.</p>
    <ol>
      <li><b>1.</b> respiración · breath</li>
      <li><b>2.</b> ánimo, valor · encouragement</li>
    </ol>
    <hr>
    <p class="how">escribe un recuerdo de alguien viejito en tu vida.<br>sopla para darle aliento.</p>
    <p class="how" lang="en">write a memory of an elder in your life.<br>blow to give it breath.</p>
  </div>
  <p id="count"><span id="rings">0</span> anillos</p>
  <div id="hint"></div>
  <div id="tip"></div>
  <div id="intro">
    <div id="introText"><button type="button"></button></div>
    <div id="calib"></div>
  </div>
  <div id="debug"></div>

<script>
// ===================================================================
// CONFIG: every position and every color lives here.
// Hand positions are in pixels of hand-cutout.png (2000 x 1502), the
// same layout as hand-labeled.png. Tree values are fractions of the
// screen (x of width, y of height) unless noted.
// ===================================================================
const CONFIG = {
  hand: {
    image: 'hand-cutout.png',
    imageSize: [2000, 1502],
    visibleSpan: [470, 1500],   // left/right edge of the hand in the image, used to fit narrow screens
    height: 0.96,               // hand height as a fraction of the screen height
    maxWidth: 0.96,             // the visible hand never gets wider than this fraction of the screen
    centerX: 0.5,               // where the hand's center sits horizontally
    brightness: 0.8,            // dims the photo a little so the tree can glow
    contrast: 1.08,
  },
  handOpacity: 0.55,            // lets the tree and background read through the hand
  panelGap: 32,                 // space kept between the left panel and the hand, in screen pixels

  // the glowing bar printed in the photo, where the visitor types
  bar: { x: 720, y: 1311, w: 520, h: 46 },

  // each path runs from the bar up through the finger; the last point is the fingertip
  fingers: {
    order: ['A', 'B', 'C', 'D', 'E'],
    A: { path: [[790, 1334], [700, 1180], [640, 1020], [590, 890], [548, 790], [522, 768]] },  // thumb
    B: { path: [[870, 1334], [815, 1150], [805, 960], [790, 760], [778, 540], [768, 338]] },   // index
    C: { path: [[965, 1334], [975, 1150], [965, 950], [955, 740], [925, 500], [890, 300], [870, 212]] }, // middle
    D: { path: [[1075, 1334], [1100, 1130], [1110, 930], [1118, 700], [1100, 480], [1078, 272]] }, // ring
    E: { path: [[1170, 1334], [1220, 1120], [1265, 960], [1335, 820], [1395, 670], [1432, 535]] }, // little
  },

  tree: {
    x: 0.8,                 // trunk position: behind the right side of the hand
    groundY: 0.8,           // where the rings lie (higher = further back)
    trunkTopY: 0.48,        // where the branches leave the trunk
    canopyY: 0.28,          // center of the crown
    canopyWidth: 0.42,
    canopyHeight: 0.48,
    ringStart: 0.08,        // first memory ring radius, as a fraction of the hand's width
    ringGap: 0.028,         // space per memory ring (fraction of hand width); shrinks as rings add up
    ringReach: 0.45,        // rings never spread past this fraction of the screen width
    ringLines: 3,           // fine lines per memory ring
    ringFlatten: 0.16,      // perspective of the ground
    ringWobble: 0.012,      // how much the rings ripple
    flareHeight: 0.14,      // how high the rings climb into the trunk (fraction of screen height)
    flareFalloff: 0.07,     // fraction of hand width
    groundLines: 26,        // faint contour lines beyond the memory rings
    shimmerSpeed: 0.05,     // iridescent colors traveling outward through the rings
    baseBlobs: 22,          // crown density before any memory
  },

  breath: {
    calibrationMs: 3000,
    sensitivity: 1,         // raise above 1 if gentle breaths are not detected
    ratio: 1.8,             // breath must be this many times louder than the room...
    stdK: 4,                // ...and this many standard deviations above it...
    minDelta: 0.006,        // ...and at least this much above it (RMS)
    fullScale: 2.5,         // how far above the threshold counts as a full breath
    startMs: 140,           // a breath must last this long to count
    endMs: 260,
    attack: 0.35,           // smoothing
    release: 0.08,
    adapt: 0.003,           // slow drift of the room baseline
  },

  light: {
    maxParticles: 900,
    dissolveMs: 700,
    idleSpeed: 0.2,         // speed up the finger when the breath pauses (path lengths per second)
    breathSpeed: 1.3,       // extra speed at full breath
    exitSpeed: 1.2,        // once the light reaches the fingertip, the rest follows at least this fast
    lag: 0.18,              // length of the stream of light
    streamWidth: 24,        // in image pixels
    jitter: 14,             // how much a sharp breath scatters the light
    flightMs: [800, 1300],  // fingertip to tree
  },

  colors: {
    background: '#050508',
    scanline: 'rgba(0, 0, 0, 0.32)',
    ink: '#3b2c20',
    inkSoft: 'rgba(70, 52, 38, 0.5)',
    barGlow: '#ffecc9',
    heldText: '#fff4e2',
    heldGlow: 'rgba(255, 214, 160, 0.9)',
    hint: 'rgba(255, 244, 228, 0.78)',
    intro: '#e9e2f5',
    tip: '#efe8ff',
    light: '#ffe9c8',
    lightCool: '#c9c0ff',
    iridescent: ['#ff4fd8', '#ffa64f', '#fff36b', '#6bffb8', '#4ff0ff', '#6f8bff', '#b9a4ff'],
    ground: '#c8c4e0',
    trunk: '#b8b2ff',
    branch: '#ddd6ff',
    node: '#fff6e0',
    canopy: ['#5d6bd8', '#7f7cf0', '#9b8cff', '#b6a8ff', '#8fb4ff', '#d9d2ff', '#6b5fc8'],
    glyph: ['#ff4fd8', '#4ff0ff', '#fff36b', '#b9a4ff', '#ffffff'],
    // left panel
    panelTitle: '#f1eeff',
    panelBody: '#d9d4ee',
    panelNumber: '#b9b2ff',
    panelMuted: '#9a94b8',
    panelLine: '#4a4566',
    panelCount: '#6f6990',
  },

  text: {
    intro: 'aliento',
    calibrating: 'silencio… / quiet…',
    write: 'un recuerdo… / a memory…',
    from: '¿de quién? / from whom?',
    // instructions at the bottom of the screen ("\n" starts a new line)
    enterThenBlow: 'presiona ↵ y sopla hacia la pantalla para que tu recuerdo llegue al árbol\n' +
                   'press ↵, then blow on your screen to send your memory to the tree',
    blow: 'sopla hacia la pantalla para que tu recuerdo llegue al árbol\n' +
          'blow on your screen to send your memory to the tree',
    enterThenHold: 'presiona ↵ y mantén la barra espaciadora para que tu recuerdo llegue al árbol\n' +
                   'press ↵, then hold the space bar to send your memory to the tree',
    hold: 'mantén la barra espaciadora para que tu recuerdo llegue al árbol\n' +
          'hold the space bar to send your memory to the tree',
  },

  storageKey: 'aliento.memories',
};

// ===================================================================
const C = CONFIG;
const $ = id => document.getElementById(id);
const treeCv = $('tree'), fxCv = $('fx'), handImg = $('hand'), bar = $('bar'), glow = $('glow');
const hint = $('hint'), tip = $('tip'), intro = $('intro'), introBtn = intro.querySelector('button'), calib = $('calib');
const introText = $('introText');
const panel = $('panel'), countEl = $('count'), ringsEl = $('rings');
const tctx = treeCv.getContext('2d'), fctx = fxCv.getContext('2d');
const DEBUG = new URLSearchParams(location.search).has('debug');

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const wait = ms => new Promise(r => setTimeout(r, ms));

function hexRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
const rgba = (hex, a) => { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${a})`; };
const PAL = C.colors.iridescent.map(hexRgb);
function palAt(f, a) {
  f = ((f % 1) + 1) % 1 * PAL.length;
  const i = Math.floor(f), k = f - i, p = PAL[i], q = PAL[(i + 1) % PAL.length];
  return `rgba(${p[0] + (q[0] - p[0]) * k | 0},${p[1] + (q[1] - p[1]) * k | 0},${p[2] + (q[2] - p[2]) * k | 0},${a})`;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// ---------- memories ----------
let memories = [];
let visitorCount = 0;
const ringBorn = {}, branchBorn = {};

const validMemory = m => m && typeof m.text === 'string' && m.text.trim();

function loadVisitor() {
  try {
    const v = JSON.parse(localStorage.getItem(C.storageKey) || '[]');
    return Array.isArray(v) ? v.filter(validMemory) : [];
  } catch (e) { return []; }
}
function saveVisitor(list) {
  try { localStorage.setItem(C.storageKey, JSON.stringify(list)); } catch (e) { /* storage unavailable */ }
}
async function loadSeeds() {
  try {
    const r = await fetch('memories.json', { cache: 'no-cache' });
    const v = await r.json();
    return Array.isArray(v) ? v.filter(validMemory) : [];
  } catch (e) { return []; }
}

function guessLang(text) {
  const s = ' ' + text.toLowerCase().replace(/[.,;:!?"]/g, ' ') + ' ';
  if (/[ñáéíóúü¿¡]/.test(s)) return 'es';
  const count = re => (s.match(re) || []).length;
  const es = count(/\s(el|la|los|las|que|de|y|un|una|es|no|por|con|para|mi|tu|siempre|nunca|cuando|pero|como|lo|se)(?=\s)/g);
  const en = count(/\s(the|and|you|to|of|is|it|that|my|your|always|never|be|when|but|like|was|with|for)(?=\s)/g);
  return es > en ? 'es' : 'en';
}

// ---------- layout ----------
let W = 0, H = 0, DPR = 1;
const L = {};

function toScreen(x, y) { return [L.hx + x * L.s, L.hy + y * L.s]; }

function makePath(pts) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
    for (let k = 0; k < 20; k++) {
      const t = k / 20, t2 = t * t, t3 = t2 * t;
      const cr = j => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);
      out.push([cr(0), cr(1)]);
    }
  }
  out.push(pts[pts.length - 1]);
  const len = [0];
  for (let i = 1; i < out.length; i++) len.push(len[i - 1] + Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]));
  const total = len[len.length - 1];
  return {
    at(u) {
      const d = clamp(u) * total;
      let i = 1;
      while (i < len.length - 1 && len[i] < d) i++;
      const a = out[i - 1], b = out[i], seg = (len[i] - len[i - 1]) || 1, k = (d - len[i - 1]) / seg;
      const tx = (b[0] - a[0]) / seg, ty = (b[1] - a[1]) / seg;
      return { x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), tx, ty };
    },
  };
}

function sizeCanvas(cv, ctx) {
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function place(el, r) {
  Object.assign(el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
}

function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  sizeCanvas(treeCv, tctx); sizeCanvas(fxCv, fctx);

  const [IW, IH] = C.hand.imageSize, [sl, sr] = C.hand.visibleSpan;
  const s = Math.min(H * C.hand.height / IH, W * C.hand.maxWidth / (sr - sl));
  L.s = s; L.hw = IW * s; L.hh = IH * s;
  L.hx = W * C.hand.centerX - (sl + sr) / 2 * s;
  L.hy = H - L.hh;
  // keep the hand clear of the left panel: nudge it right, or hide the panel if the screen is too narrow
  panel.hidden = countEl.hidden = false;
  const room = Math.max(panel.getBoundingClientRect().right, panel.querySelector('h1').getBoundingClientRect().right) + C.panelGap;
  L.hx += clamp(room - (L.hx + sl * s), 0, Math.max(0, W - 8 - (L.hx + sr * s)));
  panel.hidden = countEl.hidden = L.hx + sl * s < room;
  place(handImg, { x: L.hx, y: L.hy, w: L.hw, h: L.hh });
  L.handSpan = (sr - sl) * s;

  const [bx, by] = toScreen(C.bar.x, C.bar.y);
  L.bar = { x: bx, y: by, w: C.bar.w * s, h: C.bar.h * s };
  place(glow, L.bar); place(bar, L.bar);
  L.barFont = Math.max(11, L.bar.h * 0.42);
  bar.style.fontSize = L.barFont + 'px';
  bar.style.padding = `0 ${L.bar.h * 0.6}px`;

  L.paths = {};
  for (const k of C.fingers.order) L.paths[k] = makePath(C.fingers[k].path.map(p => toScreen(p[0], p[1])));

  const t = C.tree;
  L.cx = W * t.x; L.ground = H * t.groundY; L.trunkTop = H * t.trunkTopY;
  L.canopy = { x: L.cx, y: H * t.canopyY, rx: W * t.canopyWidth / 2, ry: H * t.canopyHeight / 2 };
  L.r0 = L.handSpan * t.ringStart;
  L.flareH = H * t.flareHeight; L.flareFall = L.handSpan * t.flareFalloff;

  heldCache = null;
  layoutTree();
  buildGlyphs();
}

function layoutTree() {
  const t = C.tree, n = Math.max(memories.length + 1, 1);
  L.gap = Math.min(L.handSpan * t.ringGap, Math.max(4, (W * t.ringReach - L.r0) / n));
  L.branches = memories.map((m, i) => branchGeom(m, i));
  ringsEl.textContent = memories.length;
  buildCanopy();
}

function ringR(i, j) {
  const lines = C.tree.ringLines;
  return L.r0 + (i + 0.15 + 0.7 * (lines > 1 ? j / (lines - 1) : 0.5)) * L.gap;
}
function ringY(R) {
  return L.ground - L.flareH * Math.exp(-Math.max(0, R - L.r0 * 0.2) / L.flareFall);
}

function branchGeom(m, i) {
  const r = rng(hash(m.text) + i * 7919), c = L.canopy;
  const ang = -Math.PI / 2 + (r() - 0.5) * Math.PI * 1.15;
  const d = 0.3 + 0.62 * r();
  const x = c.x + Math.cos(ang) * d * c.rx;
  const y = c.y + Math.sin(ang) * d * c.ry * 0.85 + c.ry * 0.12;
  const sx = L.cx + (r() - 0.5) * L.handSpan * 0.04, sy = L.trunkTop;
  const qx = sx + (x - sx) * 0.15, qy = sy + (y - sy) * 0.8;
  const pts = [];
  for (let k = 0; k <= 18; k++) {
    const u = k / 18, v = 1 - u;
    pts.push([v * v * sx + 2 * v * u * qx + u * u * x, v * v * sy + 2 * v * u * qy + u * u * y]);
  }
  return { pts, x, y, r: Math.min(c.rx, c.ry * 1.6) * (0.13 + 0.06 * r()) };
}

// ---------- the crown (pre-rendered, rebuilt when a memory joins) ----------
const canopyCv = document.createElement('canvas'), canopyCtx = canopyCv.getContext('2d');
const glyphCv = document.createElement('canvas'), glyphCtx = glyphCv.getContext('2d');

function buildCanopy() {
  sizeCanvas(canopyCv, canopyCtx);
  const g = canopyCtx, c = L.canopy;
  g.clearRect(0, 0, W, H);

  const br = rng(12345), blobs = [];
  const nb = C.tree.baseBlobs;
  for (let i = 0; i < nb; i++) {
    // fill the crown evenly (sunflower spiral), with a little randomness
    const a = i * 2.39996 + (br() - 0.5) * 0.6, d = Math.sqrt((i + 0.5) / nb) * 0.85;
    blobs.push({ x: c.x + Math.cos(a) * d * c.rx, y: c.y + Math.sin(a) * d * c.ry, r: Math.min(c.rx, c.ry * 1.6) * (0.14 + 0.08 * br()), w: 0.6 });
  }
  for (const b of L.branches) blobs.push({ x: b.x, y: b.y, r: b.r, w: 0.8 });

  // soft haze under the dots
  for (const b of blobs) {
    const gr = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.6);
    gr.addColorStop(0, rgba(C.colors.canopy[1], 0.07 * b.w));
    gr.addColorStop(1, rgba(C.colors.canopy[1], 0));
    g.fillStyle = gr;
    g.fillRect(b.x - b.r * 1.6, b.y - b.r * 1.6, b.r * 3.2, b.r * 3.2);
  }

  const cell = 8, gx = Math.ceil(W / cell) + 1, gy = Math.ceil(H / cell) + 1, field = new Float32Array(gx * gy);
  for (const b of blobs) {
    const x0 = Math.max(0, Math.floor((b.x - b.r * 2.5) / cell)), x1 = Math.min(gx - 1, Math.ceil((b.x + b.r * 2.5) / cell));
    const y0 = Math.max(0, Math.floor((b.y - b.r * 2.5) / cell)), y1 = Math.min(gy - 1, Math.ceil((b.y + b.r * 2.5) / cell));
    for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
      const dx = xx * cell - b.x, dy = (yy * cell - b.y) * 1.3;
      field[yy * gx + xx] += b.w * Math.exp(-(dx * dx + dy * dy) / (b.r * b.r));
    }
  }

  const rand = rng(777), cols = C.colors.canopy;
  const drips = [];
  for (let x = 0; x < W; x += 3) {
    const col = 0.4 + 0.6 * rand();
    let lowest = -1;
    for (let y = 0; y < L.ground; y += 2) {
      const f = field[(y / cell | 0) * gx + (x / cell | 0)] * col * clamp((1.2 - Math.hypot((x - c.x) / c.rx, (y - c.y) / c.ry)) * 2.5);
      if (f < 0.1) continue;
      lowest = y;
      const p = clamp((f - 0.1) / 0.8);
      if (rand() < p * p * (3 - 2 * p) * 0.6) {
        g.fillStyle = cols[(rand() * cols.length) | 0];
        g.globalAlpha = Math.min(1, 0.15 + p * 0.75) * (0.45 + 0.55 * rand());
        g.fillRect(x, y, 1.4, 1.6);
      }
    }
    if (lowest > 0 && col > 0.88) drips.push([x, lowest]);
  }
  // scanlines falling from the crown to the ground
  g.lineWidth = 1;
  for (const [x, y] of drips) {
    const gr = g.createLinearGradient(0, y, 0, L.ground);
    gr.addColorStop(0, rgba(cols[(x * 7) % cols.length], 0.22));
    gr.addColorStop(1, rgba(cols[(x * 7) % cols.length], 0));
    g.globalAlpha = 1; g.strokeStyle = gr;
    g.beginPath(); g.moveTo(x + 0.5, y); g.lineTo(x + 0.5, L.ground); g.stroke();
  }
  g.globalAlpha = 1;
}

function buildGlyphs() {
  sizeCanvas(glyphCv, glyphCtx);
  const g = glyphCtx, rand = rng(4242), cols = C.colors.glyph;
  g.clearRect(0, 0, W, H);
  const count = Math.round(W * H / 900);
  for (let i = 0; i < count; i++) {
    const x = Math.round(rand() * W / 7) * 7, y = Math.round(rand() * H / 9) * 9;
    const edge = Math.abs(x - W / 2) / (W / 2);
    if (rand() > 0.15 + 0.85 * edge * edge) continue;
    g.fillStyle = cols[(rand() * cols.length) | 0];
    g.globalAlpha = 0.05 + 0.2 * rand();
    g.fillRect(x, y, 2 + ((rand() * 4) | 0), 1.5);
  }
  g.globalAlpha = 1;
}

// ---------- hand mask (so hovering the hand reveals nothing) ----------
let handMask = null;
function buildHandMask() {
  try {
    const cv = document.createElement('canvas'), mw = 250, mh = Math.round(250 * C.hand.imageSize[1] / C.hand.imageSize[0]);
    cv.width = mw; cv.height = mh;
    const g = cv.getContext('2d');
    g.drawImage(handImg, 0, 0, mw, mh);
    handMask = { w: mw, h: mh, data: g.getImageData(0, 0, mw, mh).data };
  } catch (e) { handMask = null; } // e.g. opened as a file: no mask, still works
}
function handOpaque(x, y) {
  if (!handMask) return false;
  const ix = Math.floor((x - L.hx) / L.hw * handMask.w), iy = Math.floor((y - L.hy) / L.hh * handMask.h);
  if (ix < 0 || iy < 0 || ix >= handMask.w || iy >= handMask.h) return false;
  return handMask.data[(iy * handMask.w + ix) * 4 + 3] > 100;
}

// ---------- breath ----------
const B = C.breath;
const breath = {
  mode: 'none', calibrated: false, analyser: null, buf: null,
  level: 0, base: 0, std: 0, thresh: 1, active: false, strength: 0, glow: 0, rough: 0,
  above: 0, below: 0, keyHeld: false,
};

async function startMic() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no mic');
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') await ac.resume();
    const an = ac.createAnalyser();
    an.fftSize = 1024; an.smoothingTimeConstant = 0;
    ac.createMediaStreamSource(stream).connect(an);
    breath.analyser = an; breath.buf = new Float32Array(an.fftSize); breath.mode = 'mic';
    return true;
  } catch (e) {
    breath.mode = 'key';
    return false;
  }
}

function rms() {
  breath.analyser.getFloatTimeDomainData(breath.buf);
  let s = 0;
  for (const v of breath.buf) s += v * v;
  return Math.sqrt(s / breath.buf.length);
}

function setThreshold() {
  const b = breath.base;
  const raw = Math.max(b * B.ratio, b + B.stdK * breath.std, b + B.minDelta);
  breath.thresh = b + (raw - b) / B.sensitivity;
}

function calibrate(ms) {
  return new Promise(resolve => {
    const samples = [], end = performance.now() + ms;
    (function tick() {
      samples.push(rms());
      if (performance.now() < end) return requestAnimationFrame(tick);
      const mean = samples.reduce((a, v) => a + v, 0) / samples.length;
      breath.std = Math.sqrt(samples.reduce((a, v) => a + (v - mean) ** 2, 0) / samples.length);
      breath.base = breath.level = mean;
      setThreshold();
      breath.calibrated = true;
      resolve();
    })();
  });
}

function updateBreath(dt) {
  const prev = breath.strength;
  let target = 0;
  if (breath.mode === 'mic' && breath.calibrated) {
    const raw = rms(), k = raw > breath.level ? B.attack : B.release;
    breath.level += (raw - breath.level) * (1 - Math.pow(1 - k, dt * 60));
    if (breath.level > breath.thresh) { breath.above += dt * 1000; breath.below = 0; }
    else { breath.below += dt * 1000; breath.above = 0; }
    if (!breath.active && breath.above > B.startMs) breath.active = true;
    if (breath.active && breath.below > B.endMs) breath.active = false;
    if (!breath.active && breath.level < breath.thresh) {
      breath.base += (breath.level - breath.base) * B.adapt;
      setThreshold();
    }
    if (breath.active) target = clamp(0.15 + (breath.level - breath.thresh) / (breath.thresh * B.fullScale));
    breath.glow = clamp((breath.level - breath.base) / ((breath.thresh - breath.base) || 1), 0, 1.5);
  } else if (breath.mode === 'key') {
    breath.active = breath.keyHeld;
    target = breath.keyHeld ? 0.55 : 0;
    breath.glow = breath.strength;
  }
  breath.strength += (target - breath.strength) * (1 - Math.pow(0.9, dt * 60));
  const change = Math.abs(breath.strength - prev) / Math.max(dt, 1e-3);
  breath.rough += (change - breath.rough) * 0.1;
}

// ---------- state ----------
let state = 'intro';
let held = '';            // the memory waiting to be released
let release = null;

function setState(s) {
  state = s;
  if (s === 'write') {
    bar.readOnly = false; bar.value = ''; bar.maxLength = 300;
    bar.placeholder = C.text.write;
  } else if (s === 'from') {
    bar.readOnly = false; bar.value = ''; bar.maxLength = 60;
    bar.placeholder = C.text.from;
  } else if (s === 'ready') {
    bar.readOnly = true; bar.placeholder = '';
  } else if (s === 'release') {
    bar.readOnly = true; bar.value = ''; bar.placeholder = '';
  }
  updateHint();
}

function updateHint() {
  const mic = breath.mode === 'mic';
  let text = '';
  if (state === 'write' && bar.value.trim()) text = mic ? C.text.enterThenBlow : C.text.enterThenHold;
  else if (state === 'ready' || (state === 'from' && (mic || !bar.value))) text = mic ? C.text.blow : C.text.hold;
  else if (state === 'from') text = C.text.enterThenHold;
  if (text) hint.textContent = text;
  hint.style.opacity = text ? 1 : 0;
}

bar.addEventListener('input', updateHint);
bar.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (state === 'write' && bar.value.trim()) { held = bar.value.trim(); heldCache = null; heldShown = performance.now(); setState('from'); }
    else if (state === 'from') setState('ready');
  } else if (e.key === 'Escape' && (state === 'from' || state === 'ready')) {
    held = ''; setState('write');
  }
});

// spacebar breath, only when the microphone is unavailable
const spaceCounts = () => breath.mode === 'key' && (state === 'ready' || (state === 'from' && !bar.value));
addEventListener('keydown', e => {
  if (e.code === 'Space' && spaceCounts()) { e.preventDefault(); breath.keyHeld = true; return; }
  if ((state === 'write' || state === 'from') && document.activeElement !== bar && e.key.length === 1 && !e.metaKey && !e.ctrlKey) bar.focus();
});
addEventListener('keyup', e => { if (e.code === 'Space') breath.keyHeld = false; });
addEventListener('blur', () => { breath.keyHeld = false; });

// ---------- held text, drawn just above the bar ----------
let heldCache = null, heldShown = 0;

function heldLayout() {
  if (heldCache) return heldCache;
  const maxW = L.bar.w * 1.3;
  let fs = Math.max(13, L.bar.h * 0.62), lines;
  for (;;) {
    fctx.font = `italic 400 ${fs}px "Cormorant Garamond", serif`;
    lines = [];
    let line = '';
    for (const word of held.split(/\s+/)) {
      const test = line ? line + ' ' + word : word;
      if (line && fctx.measureText(test).width > maxW) { lines.push(line); line = word; } else line = test;
    }
    if (line) lines.push(line);
    if (lines.length <= 3 || fs <= 10) break;
    fs *= 0.9;
  }
  return heldCache = { fs, lines, lh: fs * 1.15 };
}

function drawHeld(g, alpha, glowOn) {
  const { fs, lines, lh } = heldLayout();
  g.save();
  g.font = `italic 400 ${fs}px "Cormorant Garamond", serif`;
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.globalAlpha = alpha;
  g.fillStyle = C.colors.heldText;
  if (glowOn) { g.shadowColor = C.colors.heldGlow; g.shadowBlur = fs * 0.7; }
  const cx = L.bar.x + L.bar.w / 2, bottom = L.bar.y - L.bar.h * 0.35;
  lines.forEach((ln, i) => g.fillText(ln, cx, bottom - (lines.length - 1 - i) * lh));
  g.restore();
}

// ---------- release: text -> light -> finger -> tree ----------
const sampleCv = document.createElement('canvas'), sampleCtx = sampleCv.getContext('2d', { willReadFrequently: true });

function makeSprite(hex) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.25, rgba(hex, 0.85));
  gr.addColorStop(1, rgba(hex, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
  return cv;
}
const SPRITE_WARM = makeSprite(C.colors.light), SPRITE_COOL = makeSprite(C.colors.lightCool);

function beginRelease(now) {
  const from = state === 'from' || state === 'ready' ? bar.value.trim() : '';
  const mem = { text: held, from, lang: guessLang(held) };
  const finger = C.fingers.order[visitorCount % C.fingers.order.length];
  const path = L.paths[finger];
  const target = branchGeom(mem, memories.length);

  // draw the words offscreen and turn their pixels into light
  sampleCv.width = Math.ceil(W); sampleCv.height = Math.ceil(H);
  const g = sampleCtx;
  g.clearRect(0, 0, W, H);
  drawHeld(g, 1, false);
  if (from) {
    g.font = `${L.barFont}px "Courier Prime", monospace`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    g.fillText(from, L.bar.x + L.bar.w / 2, L.bar.y + L.bar.h / 2);
  }
  const top = Math.max(0, Math.floor(L.bar.y - L.bar.h * 6)), bottom = Math.min(H, Math.ceil(L.bar.y + L.bar.h * 1.5));
  const left = Math.max(0, Math.floor(L.bar.x - L.bar.w * 0.4)), right = Math.min(W, Math.ceil(L.bar.x + L.bar.w * 1.4));
  const img = g.getImageData(left, top, right - left, bottom - top), iw = right - left, ih = bottom - top;
  let lit = 0;
  for (let i = 3; i < img.data.length; i += 4) if (img.data[i] > 110) lit++;
  const step = Math.max(1, Math.ceil(Math.sqrt(lit / C.light.maxParticles)));
  const r = Math.random, start = path.at(0), particles = [];
  for (let y = 0; y < ih; y += step) for (let x = 0; x < iw; x += step) {
    if (img.data[(y * iw + x) * 4 + 3] <= 110) continue;
    const ox = left + x, oy = top + y;
    particles.push({
      x0: ox, y0: oy, x: ox, y: oy,
      gx: start.x + (r() - 0.5) * L.bar.h * 0.8, gy: start.y + (r() - 0.5) * L.bar.h * 0.4,
      delay: r() * C.light.dissolveMs * 0.45,
      lag: r() * C.light.lag, off: r() - 0.5, ph: r() * 100,
      tx: target.x + (r() - 0.5) * target.r, ty: target.y + (r() - 0.5) * target.r * 0.7,
      dur: lerp(C.light.flightMs[0], C.light.flightMs[1], r()),
      size: 0.7 + r() * 0.7, fs: 0, done: false,
    });
  }
  release = { start: now, p: 0, path, particles, mem, committed: false };
  setState('release');
  bar.blur();
}

function commit(now) {
  const i = memories.length;
  memories.push(release.mem);
  const visitor = loadVisitor();
  visitor.push(release.mem);
  saveVisitor(visitor);
  visitorCount++;
  ringBorn[i] = now; branchBorn[i] = now;
  layoutTree();
}

function stepRelease(now, dt, t) {
  const R = release, Lt = C.light, elapsed = now - R.start;
  const traveling = elapsed > Lt.dissolveMs;
  if (traveling) {
    let speed = Lt.idleSpeed + breath.strength * Lt.breathSpeed;
    if (R.p >= 1) speed = Math.max(speed, Lt.exitSpeed);
    R.p += speed * dt;
  }
  const jit = Lt.jitter * L.s * clamp(breath.rough * 0.6, 0, 2.5);
  const width = Lt.streamWidth * L.s;
  let done = 0, landed = 0;

  for (const q of R.particles) {
    if (q.done) { done++; landed++; continue; }
    if (!traveling || R.p - q.lag < 0) {
      const k = easeInOut(clamp((elapsed - q.delay) / (Lt.dissolveMs * 0.55)));
      q.x = lerp(q.x0, q.gx, k) + Math.sin(t * 3 + q.ph) * 1.5;
      q.y = lerp(q.y0, q.gy, k) - Math.sin(k * Math.PI) * L.bar.h * 0.4;
      q.phase = 0;
      continue;
    }
    const u = R.p - q.lag;
    if (u <= 1) {
      const pt = R.path.at(u), nx = -pt.ty, ny = pt.tx;
      const spread = q.off * width * (1 - 0.65 * u) + Math.sin(t * 9 + q.ph) * jit * q.off * 2;
      q.x = pt.x + nx * spread; q.y = pt.y + ny * spread;
      q.phase = 1;
      continue;
    }
    if (!q.fs) {
      const end = R.path.at(1);
      q.fs = now; q.sx = q.x; q.sy = q.y;
      q.c1x = q.x + end.tx * L.hh * 0.18 + (Math.random() - 0.5) * L.hw * 0.08;
      q.c1y = q.y + end.ty * L.hh * 0.18 - L.hh * 0.05;
      q.c2x = lerp(q.c1x, q.tx, 0.6); q.c2y = Math.min(q.c1y, q.ty) - H * 0.06;
    }
    const f = clamp((now - q.fs) / q.dur), e = easeInOut(f), v = 1 - e;
    q.x = v * v * v * q.sx + 3 * v * v * e * q.c1x + 3 * v * e * e * q.c2x + e * e * e * q.tx;
    q.y = v * v * v * q.sy + 3 * v * v * e * q.c1y + 3 * v * e * e * q.c2y + e * e * e * q.ty;
    q.phase = 2; q.f = f;
    if (f > 0.85) landed++;
    if (f >= 1) q.done = true;
  }

  if (!R.committed && landed > R.particles.length * 0.4) { R.committed = true; commit(now); }
  if (done === R.particles.length) {
    if (!R.committed) commit(now);
    release = null; held = ''; heldCache = null;
    setState('write');
    bar.focus();
  }
}

function drawRelease(g, now, t) {
  const R = release, elapsed = now - R.start;
  g.save();
  g.globalCompositeOperation = 'lighter';
  const base = Math.max(3, L.bar.h * 0.2);
  // the held words fade as they dissolve
  const fade = 1 - clamp(elapsed / (C.light.dissolveMs * 0.5));
  if (fade > 0) drawHeld(g, fade * 0.8, true);
  for (const q of R.particles) {
    if (q.done) continue;
    let a = 0.85, sz = base * q.size, cool = 0;
    if (q.phase === 0) a = 0.35 + 0.5 * clamp((elapsed - q.delay) / 300);
    if (q.phase === 2) { a = 0.85 * (1 - clamp((q.f - 0.7) / 0.3)); sz *= lerp(1, 0.45, q.f); cool = q.f; }
    g.globalAlpha = a * (1 - cool);
    g.drawImage(SPRITE_WARM, q.x - sz / 2, q.y - sz / 2, sz, sz);
    if (cool > 0) { g.globalAlpha = a * cool; g.drawImage(SPRITE_COOL, q.x - sz / 2, q.y - sz / 2, sz, sz); }
  }
  // a soft glow leading the stream up the finger
  if (elapsed > C.light.dissolveMs && R.p < 1.05) {
    const h = R.path.at(Math.min(R.p, 1)), sz = L.bar.h * (2.2 + breath.strength * 1.5);
    g.globalAlpha = 0.35 + 0.35 * breath.strength + 0.08 * Math.sin(t * 5);
    g.drawImage(SPRITE_WARM, h.x - sz / 2, h.y - sz / 2, sz, sz);
  }
  g.restore();
}

// ---------- drawing ----------
let hovered = null;

function drawEllipse(g, R, wobble, t) {
  const cy = ringY(R), fl = C.tree.ringFlatten, N = 84;
  g.beginPath();
  for (let k = 0; k <= N; k++) {
    const a = k / N * Math.PI * 2;
    const rr = R * (1 + wobble * (0.6 * Math.sin(a * 3 + t * 0.7 + R * 0.013) + 0.4 * Math.sin(a * 5 - t * 0.5 + R * 0.007)));
    const x = L.cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * fl;
    k ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
}

function drawTree(t, now) {
  const g = tctx, tr = C.tree, n = memories.length, lines = tr.ringLines;
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.fillStyle = C.colors.background;
  g.fillRect(0, 0, W, H);
  g.globalAlpha = 0.5 + 0.1 * Math.sin(t * 0.4);
  g.drawImage(glyphCv, 0, 0, W, H);
  g.globalAlpha = 0.9 + 0.1 * Math.sin(t * 0.6);
  g.drawImage(canopyCv, 0, 0, W, H);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'lighter';

  // trunk: a bundle of fine vertical lines
  const trunkLines = 6 + Math.min(n, 40), topY = L.trunkTop, botY = L.ground - L.flareH * 0.95;
  g.lineWidth = 0.7;
  for (let k = 0; k < trunkLines; k++) {
    const f = trunkLines > 1 ? k / (trunkLines - 1) - 0.5 : 0;
    const xb = L.cx + f * L.r0 * 0.5, xt = L.cx + f * L.r0 * 0.25 + Math.sin(t * 0.3 + k) * 1.5;
    g.strokeStyle = rgba(C.colors.trunk, 0.18 + 0.1 * Math.sin(t + k));
    g.beginPath(); g.moveTo(xb, botY); g.lineTo(xt, topY); g.stroke();
  }

  // branches and their nodes
  L.branches.forEach((b, i) => {
    const grow = branchBorn[i] ? easeOut(clamp((now - branchBorn[i]) / 2200)) : 1;
    const hot = hovered === i;
    const last = Math.max(1, Math.round(grow * (b.pts.length - 1)));
    g.strokeStyle = rgba(C.colors.branch, hot ? 0.95 : 0.26);
    g.lineWidth = hot ? 1.4 : 0.8;
    g.beginPath(); g.moveTo(b.pts[0][0], b.pts[0][1]);
    for (let k = 1; k <= last; k++) g.lineTo(b.pts[k][0], b.pts[k][1]);
    g.stroke();
    if (grow >= 1) {
      g.fillStyle = rgba(C.colors.node, hot ? 1 : 0.55 + 0.25 * Math.sin(t * 1.3 + i));
      g.beginPath(); g.arc(b.x, b.y, hot ? 3 : 1.8, 0, Math.PI * 2); g.fill();
    }
  });

  // inner rings climbing into the trunk
  g.lineWidth = 0.8;
  for (let k = 0; k < 18; k++) {
    g.strokeStyle = palAt(k * 0.07 - t * tr.shimmerSpeed, 0.5);
    drawEllipse(g, L.r0 * (0.2 + 0.8 * k / 18), tr.ringWobble * 0.5, t);
  }

  // one ring per memory, newest outermost
  for (let i = 0; i < n; i++) {
    const age = ringBorn[i] ? clamp((now - ringBorn[i]) / 3200) : 1, hot = hovered === i;
    for (let j = 0; j < lines; j++) {
      let R = ringR(i, j);
      if (age < 1) R = lerp(L.r0 * 0.3, R, easeOut(age));
      g.lineWidth = hot ? 1.8 : 1.2 + (1 - age) * 1.5;
      g.strokeStyle = hot ? rgba(C.colors.node, 0.95) : palAt(i * 0.21 + j * 0.06 - t * tr.shimmerSpeed, 0.85);
      drawEllipse(g, R, tr.ringWobble, t);
    }
  }

  // faint contour lines spreading over the ground
  const outer = ringR(n, 0);
  g.lineWidth = 0.6;
  for (let k = 0; k < tr.groundLines; k++) {
    const R = outer + k * L.handSpan * 0.022 * (1 + k * 0.08);
    g.strokeStyle = rgba(C.colors.ground, 0.22 * (1 - k / tr.groundLines));
    drawEllipse(g, R, tr.ringWobble * 2, t);
  }
  g.globalCompositeOperation = 'source-over';
}

function drawFx(t, now) {
  fctx.clearRect(0, 0, W, H);
  if (state === 'from' || state === 'ready') drawHeld(fctx, clamp((now - heldShown) / 600), true);
  if (release) drawRelease(fctx, now, t);
}

function updateGlow(t) {
  let g = state === 'write' ? (bar.value ? 0.45 : 0.28)
        : state === 'from' || state === 'ready' ? 0.85
        : state === 'release' ? 0.15 : 0.2;
  g = clamp(g + 0.06 * Math.sin(t * 1.6) + breath.glow * 0.45, 0, 1.5);
  const c = hexRgb(C.colors.barGlow).join(',');
  glow.style.boxShadow = `0 0 ${8 + g * 34}px ${2 + g * 9}px rgba(${c},${0.15 + g * 0.4}), inset 0 0 ${4 + g * 10}px rgba(${c},${0.2 + g * 0.4})`;
  glow.style.background = `rgba(${c},${g * 0.2})`;
}

// ---------- hover ----------
function hitTest(x, y) {
  if (state === 'intro' || handOpaque(x, y)) return null;
  let best = null, bd = Infinity;
  L.branches.forEach((b, i) => {
    for (const p of b.pts) {
      const d = Math.hypot(p[0] - x, p[1] - y);
      if (d < 10 && d < bd) { bd = d; best = i; }
    }
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < 16 && d < bd) { bd = d; best = i; }
  });
  if (best !== null) return best;
  const fl = C.tree.ringFlatten, mid = (C.tree.ringLines - 1) / 2;
  for (let i = 0; i < memories.length; i++) {
    const R = ringR(i, mid), cy = ringY(R);
    const d = Math.hypot(x - L.cx, (y - cy) / fl);
    const e = Math.abs(d - R);
    if (e < L.gap * 0.5 && e < bd) { bd = e; best = i; }
  }
  return best;
}

function showTip(i, x, y) {
  if (i === hovered) { if (i !== null) moveTip(x, y); return; }
  hovered = i;
  if (i === null) { tip.style.opacity = 0; return; }
  const m = memories[i];
  tip.textContent = m.text;
  if (m.from) {
    const f = document.createElement('span');
    f.className = 'from'; f.textContent = '— ' + m.from;
    tip.appendChild(f);
  }
  tip.lang = m.lang || '';
  moveTip(x, y);
  tip.style.opacity = 1;
}
function moveTip(x, y) {
  const r = tip.getBoundingClientRect();
  tip.style.left = clamp(x + 16, 8, W - r.width - 8) + 'px';
  tip.style.top = clamp(y + 16, 8, H - r.height - 8) + 'px';
}
addEventListener('pointermove', e => showTip(hitTest(e.clientX, e.clientY), e.clientX, e.clientY));
addEventListener('pointerdown', e => showTip(hitTest(e.clientX, e.clientY), e.clientX, e.clientY));

// ---------- loop ----------
const debugEl = $('debug');
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000;
  last = now;
  updateBreath(dt);
  if ((state === 'from' || state === 'ready') && breath.active && held) beginRelease(now);
  if (release) stepRelease(now, dt, t);
  updateGlow(t);
  drawTree(t, now);
  drawFx(t, now);
  if (DEBUG) {
    debugEl.textContent = `mode ${breath.mode}  state ${state}\nlevel ${breath.level.toFixed(4)}\nbase  ${breath.base.toFixed(4)}\nthres ${breath.thresh.toFixed(4)}\nbreath ${breath.active ? 'YES' : 'no'}  strength ${breath.strength.toFixed(2)}`;
  }
  requestAnimationFrame(frame);
}

// ---------- start ----------
async function init() {
  const root = document.documentElement.style, col = C.colors;
  root.setProperty('--bg', col.background);
  root.setProperty('--scan', col.scanline);
  root.setProperty('--ink', col.ink);
  root.setProperty('--ink-soft', col.inkSoft);
  root.setProperty('--hint', col.hint);
  root.setProperty('--tip', col.tip);
  root.setProperty('--intro', col.intro);
  root.setProperty('--panel-title', col.panelTitle);
  root.setProperty('--panel-body', col.panelBody);
  root.setProperty('--panel-num', col.panelNumber);
  root.setProperty('--panel-muted', col.panelMuted);
  root.setProperty('--panel-line', col.panelLine);
  root.setProperty('--panel-count', col.panelCount);
  handImg.style.filter = `brightness(${C.hand.brightness}) contrast(${C.hand.contrast})`;
  handImg.style.opacity = C.handOpacity;
  introBtn.textContent = C.text.intro;
  if (DEBUG) debugEl.style.display = 'block';

  handImg.addEventListener('load', buildHandMask);
  handImg.src = C.hand.image;
  layout();
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 120); });
  document.fonts.ready.then(layout); // the panel's width is only final once Courier Prime has loaded
  requestAnimationFrame(frame);

  const [seeds, visitor] = [await loadSeeds(), loadVisitor()];
  memories = seeds.concat(visitor);
  visitorCount = visitor.length;
  layoutTree();
}

introBtn.addEventListener('click', async () => {
  introText.classList.add('gone');
  calib.textContent = C.text.calibrating;
  calib.style.opacity = 1;
  const ok = await startMic();
  if (ok) await calibrate(C.breath.calibrationMs); else await wait(1400);
  calib.style.opacity = 0;
  intro.style.opacity = 0;
  intro.style.pointerEvents = 'none';
  setTimeout(() => intro.remove(), 2600);
  setState('write');
  bar.focus();
});

init();
</script>
</body>
